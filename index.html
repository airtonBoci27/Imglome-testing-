<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Jornada Científica Internacional | IMGLOME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #000033; margin: 0; overflow-x: hidden; }
        #particles-js { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at center, #001a4d 0%, #000033 100%); z-index: 1; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .text-gradient { background: linear-gradient(to right, #67e8f9, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .info-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s ease; }
        .input-glass { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; color: white; }
        .input-glass:focus { background: rgba(255, 255, 255, 0.15); border-color: #22d3ee; outline: none; box-shadow: 0 0 15px rgba(34, 211, 238, 0.2); }
        select option { color: #000; background: #fff; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-10">

    <div id="particles-js"></div>

    <main class="relative z-10 w-full max-w-6xl glass rounded-[2.5rem] md:rounded-[3rem] overflow-hidden flex flex-col md:flex-row shadow-2xl">
        
        <div class="w-full md:w-5/12 p-6 md:p-14 border-b md:border-b-0 md:border-r border-white/10 flex flex-col justify-center bg-white/5">
            <div class="bg-white p-2 md:p-3 rounded-2xl inline-block mb-6 md:mb-10 w-fit shadow-2xl mx-auto md:mx-0">
                <img src="https://imglome.com/wp-content/uploads/2023/06/logo-imglome.png" alt="IMGLOME" class="h-6 md:h-8">
            </div>

            <h1 class="text-xl md:text-4xl font-800 text-white leading-tight mb-6 md:mb-12 text-center md:text-left">
                Jornada Científica Internacional de <br>
                <span class="text-gradient leading-relaxed">Tecnologías en Rehabilitación</span>
            </h1>

            <div class="space-y-3 md:space-y-4">
                <div class="info-card p-4 md:p-6 rounded-2xl md:rounded-3xl flex items-center gap-4 md:gap-6">
                    <div class="bg-cyan-500/20 p-3 rounded-xl text-cyan-400">
                        <svg class="w-6 md:w-8 h-6 md:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase font-bold text-gray-400 tracking-widest leading-none mb-1">Lugar</p>
                        <p class="text-white text-sm md:text-lg font-semibold leading-tight">Sheraton Lima Historic Center</p>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 md:gap-4">
                    <div class="info-card p-4 md:p-6 rounded-2xl md:rounded-3xl flex flex-col justify-center border-l-4 border-l-blue-500">
                        <p class="text-[10px] uppercase font-bold text-gray-400 tracking-widest mb-1">Fecha</p>
                        <p class="text-white text-lg md:text-2xl font-800">06 - 07</p>
                        <p class="text-blue-300 text-[10px] md:text-xs font-semibold uppercase italic">Junio, 2026</p>
                    </div>
                    <div class="info-card p-4 md:p-6 rounded-2xl md:rounded-3xl flex flex-col justify-center border-l-4 border-l-cyan-500">
                        <p class="text-[10px] uppercase font-bold text-gray-400 tracking-widest mb-1">Horario</p>
                        <p class="text-white text-lg md:text-2xl font-800">08 - 05</p>
                        <p class="text-cyan-300 text-[10px] md:text-xs font-semibold uppercase italic">AM a PM</p>
                    </div>
                </div>
            </div>
            
            <p class="hidden md:block mt-auto pt-10 text-white/30 text-[11px] uppercase tracking-[0.4em]">IMGLOME 2026</p>
        </div>

        <div class="w-full md:w-7/12 p-6 md:p-14">
            <h2 class="text-lg md:text-xl font-bold text-white mb-6 md:mb-8 flex items-center gap-3 uppercase tracking-widest text-center md:text-left">
                <span class="text-cyan-400">Confirmar</span> Asistencia
                <div class="h-px flex-grow bg-white/10"></div>
            </h2>
            
            <form class="space-y-4 md:space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                    <div class="flex gap-2">
                        <div class="w-1/3">
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Tipo</label>
                            <select class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                                <option>DNI</option><option>C.E.</option>
                            </select>
                        </div>
                        <div class="w-2/3">
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Número</label>
                            <input type="number" placeholder="00000000" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Nombre</label>
                        <input type="text" placeholder="Ej. Juan" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 md:gap-5">
                    <input type="text" placeholder="Ap. Paterno" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                    <input type="text" placeholder="Ap. Materno" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3 md:gap-5">
                    <input type="tel" placeholder="Celular" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                    <input type="text" placeholder="Cargo" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">
                </div>

                <input type="email" placeholder="Email institucional" class="input-glass w-full rounded-xl p-3 text-xs md:text-sm">

                <select class="input-glass w-full rounded-xl p-3 md:p-3.5 text-xs md:text-sm appearance-none cursor-pointer">
                    <option disabled selected>Seleccione Especialidad</option>
                    <option>Medicina Física y Rehabilitación</option>
                    <option>Terapia Física y Rehabilitación</option>
                    <option>Medicina Deportiva</option>
                    <option>Otro</option>
                </select>

                <div class="flex flex-col md:flex-row items-center justify-between gap-6 pt-4">
                    <div class="flex gap-6 md:gap-8">
                        <label class="flex items-center gap-2 cursor-pointer text-white text-xs md:text-sm">
                            <input type="radio" name="role" class="accent-cyan-400 w-4 h-4" checked> Visitante
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-white text-xs md:text-sm">
                            <input type="radio" name="role" class="accent-cyan-400 w-4 h-4"> Profesional de la salud
                        </label>
                    </div>
                    <button type="button" class="w-full md:w-auto bg-gradient-to-r from-cyan-400 to-blue-600 px-10 md:px-14 py-4 md:py-5 rounded-2xl font-bold uppercase tracking-widest text-[10px] md:text-xs shadow-lg shadow-cyan-500/30 hover:scale-105 active:scale-95 transition-all">
                        Confirmar Asistencia
                    </button>
                </div>
            </form>
            <p class="md:hidden mt-10 text-center text-white/30 text-[9px] uppercase tracking-[0.2em]">IMGLOME 2026</p>
        </div>
    </main>

    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#22d3ee" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#22d3ee", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5, "out_mode": "out" }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } } },
            "retina_detect": true
        });
    </script>
</body>
</html>
